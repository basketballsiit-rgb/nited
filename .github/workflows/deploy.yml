name: Deploy Nited

# สั่งให้ทำงานทุกครั้งที่มีการ Push โค้ดมาที่เส้นทาง main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: เชื่อมต่อเซิร์ฟเวอร์และอัปเดตระบบ
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # 1. เข้าไปที่โฟลเดอร์โปรเจกต์
          cd /var/www/html/nited
          
          # 2. ดึงโค้ดล่าสุดจาก GitHub (ใช้ fetch/reset เพื่อทับไฟล์ที่อาจถูกแก้ในเซิร์ฟเวอร์)
          git fetch --all
          git reset --hard origin/main
          
          # 3. ตั้งค่า Permission โฟลเดอร์ uploads ให้สามารถบันทึกคู่มือการใช้งานและไฟล์แนบได้
          mkdir -p uploads
          chmod 777 -R uploads/
